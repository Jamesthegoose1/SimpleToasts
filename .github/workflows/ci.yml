name: CI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:    

permissions:
  contents: write       

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installs every tool pinned in rokit.toml (rojo, selene, stylua, luau-lsp).
      - name: Install tools (Rokit)
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Lint (selene)
        run: selene src demo

      - name: Formatting (stylua)
        run: stylua --check src demo

      - name: Download Roblox type definitions
        run: curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

      - name: Type-check (luau-lsp)
        run: |
          rojo sourcemap demo.project.json -o sourcemap.json
          luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json src demo

      # Structural check: both the package model and the demo place must build.
      - name: Build (rojo)
        run: |
          rojo build default.project.json -o SimpleToasts.rbxm
          rojo build demo.project.json -o demo.rbxlx

      - name: Generate timestamp for the release tag
        run: echo "DATE_TAG=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-${{ env.DATE_TAG }}
          name: Daily Build ${{ env.DATE_TAG }}
          body: "Automated daily build of SimpleToasts."
          files: |
            SimpleToasts.rbxm
            demo.rbxlx
